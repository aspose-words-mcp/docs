variables:
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  BRANCH_NAME: master
  DOCKER_TLS_CERTDIR: "/certs"
  # GIT_SSL_NO_VERIFY: "true"  # Add this line to ignore SSL verification, because we have self-signed certificate

  # build
  GIT_DEPTH: 1
  DOCS_FULL_ARCHIVE_NAME: words-docs.tar.gz
  DOCS_TEMPLATE_PROJECT_NAME: docs-template
  CI_HOME_FOLDER: /opt/gitlab-words-ci
  HUGO_PATH: $CI_HOME_FOLDER/bins/hugo
  HUGO_VERSION: "0.151.0"
  HUGO_DOWNLOAD_URL: "https://github.com/gohugoio/hugo/releases/download/v0.151.0/hugo_extended_0.151.0_Linux-64bit.tar.gz"
  DOCS_TEMPLATE_BRANCH_NAME: main
  DOCS_TEMPLATE_CONTAINER_PATH: $CI_HOME_FOLDER/docs-template
  DOCS_BUILD_OUTPUT: $CI_HOME_FOLDER/$DOCS_BUILD_OUTPUT_FOLDER
  DOCS_BUILD_OUTPUT_FOLDER: output-static-docs-words
  DOCS_BUILD_OUTPUT_ARCHIVE: $CI_PROJECT_DIR/output-static-docs-words-archive
  NPM_REGISTRY_CERT_DIR: $CI_HOME_FOLDER/certs
  NPM_REGISTRY_CERT_PATH: $NPM_REGISTRY_CERT_DIR/npm-registry-cert.pem

  # deploy
  COPY_FOLDER: /home/service_words
  COPY_USER_NAME: service_words
  COPY_SERVER_ADDRESS: 172.20.4.232
  SYNC_TYPE: words # "words" (https://docs.aspose.com/words/) or "words-qa" (https://docs.aspose.com/words-qa/)
  SYNC_FOLDER: /var/www/docs.aspose.com/html/$SYNC_TYPE

stages:
  - build
  - deploy

default:
  tags:
    - documentation
    - words

.rules:build:
  rules:
    # - if: '$CI_COMMIT_BRANCH == $BRANCH_NAME'
    - when: on_success

.rules:deploy:
  rules:
    - if: '$CI_COMMIT_BRANCH == $BRANCH_NAME'
      when: on_success

    - when: never

.scripts:
  apk_cache_setup: &apk_cache_setup
    - mkdir -p .apk-cache
    - export APK_CACHE_DIR="$(pwd)/.apk-cache"
    - mkdir -p /etc/apk
    - echo "cache-dir = $APK_CACHE_DIR" > /etc/apk/apk.conf

build:
  stage: build
  image: node:22
  timeout: 2h
  extends: .rules:build
  cache:
    key: "$CI_COMMIT_REF_SLUG-apk-npm"
    paths:
      - .apk-cache/
      - .npm-cache/
    policy: pull-push
  before_script:
    # - *apk_cache_setup
    - echo "MARY-TEST-123"

    # Diagnostics
    - date -u
    - cat /etc/os-release
    - cat /etc/apt/sources.list.d/debian.sources || true

    # Base tools
    - apt-get clean
    - rm -rf /var/lib/apt/lists/*
    - apt-get update -o Debug::Acquire::gpgv=true
    - apt-get install -y bash curl tar git git-lfs jq
    - bash --version

    # Install Hugo Extended
    - mkdir -p /tmp/hugo
    - echo "HUGO_DOWNLOAD_URL=$HUGO_DOWNLOAD_URL"
    - curl -L $HUGO_DOWNLOAD_URL -o /tmp/hugo/hugo.tar.gz
    - tar -xzf /tmp/hugo/hugo.tar.gz -C /tmp/hugo
    - mkdir -p $(dirname $HUGO_PATH)
    - mv /tmp/hugo/hugo $HUGO_PATH
    - chmod +x $HUGO_PATH

    # Diagnostics
    - node --version
    - npm --version
    - $HUGO_PATH version
    - ls -la $HUGO_PATH
    
    - npm config set cache "$CI_PROJECT_DIR/.npm-cache"
    # - sed -i 's/https/http/' /etc/apk/repositories
    # - apk update
    # - apk add --no-cache openssl ca-certificates
    # - sed -i 's/http/https/' /etc/apk/repositories
    # - update-ca-certificates --fresh
    # - mkdir -p $NPM_REGISTRY_CERT_DIR
    # - openssl s_client -showcerts -connect registry.npmjs.org:443 </dev/null 2>/dev/null | openssl x509 -outform PEM > $NPM_REGISTRY_CERT_PATH
    # - echo "HostName $(hostname), RunnerDescription $CI_RUNNER_DESCRIPTION, ProjectDirectory $CI_PROJECT_DIR, Git Depth $GIT_DEPTH, Docs template url $DOCS_TEMPLATE_GIT_URL, Docs template path $DOCS_TEMPLATE_CONTAINER_PATH, The current branch is $CI_COMMIT_REF_NAME"
    # - echo "Installing Git..."
    # - apk update && apk add --no-cache git

    # Git LFS
    - git lfs install --force
    - git lfs pull

    - echo "The current branch is $CI_COMMIT_REF_NAME"
    
    # - git --version
    # - git lfs version
    # - node --version
    # - npm --version
    # - tar --version
    # - apk info gcompat
    # - apk info libstdc++

  script:
    - echo "Navigate to docs template repository location..."
    - mkdir -p "$DOCS_TEMPLATE_CONTAINER_PATH"
    - cd "$DOCS_TEMPLATE_CONTAINER_PATH"

    - echo "Fetch docs template repository..."
    - git clone --depth "$GIT_DEPTH" "https://$DOCS_TEMPLATE_PROJECT_NAME:$DOCS_TEMPLATE_CI_CD_ACCESS_TOKEN@$DOCS_TEMPLATE_GIT_URL" .

    - echo "Checkout template $DOCS_TEMPLATE_BRANCH_NAME branch..."
    - git checkout "$DOCS_TEMPLATE_BRANCH_NAME"

    - echo "Replace content path in docs.aspose.com-words.toml..."
    - sed -i "s|../md-words|$CI_PROJECT_DIR|g" ./configs/docs.aspose.com-words.toml

    - echo "Installing project dependencies..."
    - npm ci

    - echo "Documentation build started..."
    - |
      "$HUGO_PATH" \
        --templateMetrics \
        --templateMetricsHints \
        --cleanDestinationDir \
        --source "$DOCS_TEMPLATE_CONTAINER_PATH" \
        --baseURL "https://docs.aspose.com/$SYNC_TYPE" \
        --contentDir "$CI_PROJECT_DIR" \
        --config "config.toml,configs/docs.aspose.com-words.toml" \
        --destination "$DOCS_BUILD_OUTPUT"

    - |
      echo "===== BUILD SUMMARY ====="
      echo "Markdown: $(find "$DOCS_BUILD_OUTPUT" -type f -name '*.md' | wc -l)"
      echo "HTML:     $(find "$DOCS_BUILD_OUTPUT" -type f -name '*.html' | wc -l)"

    - |
      echo "===== HTML INTEGRITY CHECK: BEFORE ====="

      find "$DOCS_BUILD_OUTPUT" -type f -name "*.html" \
          -exec sha256sum {} + | sort > /tmp/html-before.txt

    - |
      bash <<'BASH'
      set -o pipefail

      if [ -z "${GITHUB_TOKEN:-}" ]; then
          echo "ERROR: GITHUB_TOKEN is empty or not set."
          exit 1
      fi

      echo "===== POST-PROCESSING MARKDOWN ====="
      echo "===== START GIST PROCESSING ====="
      date

      set -o pipefail

      declare -A gist_cache
      declare -A source_cache

      file_count=0
      gist_count=0
      replaced_count=0
      failed_count=0

      while IFS= read -r -d '' file; do
          file_count=$((file_count + 1))

          if (( file_count % 2000 == 0 )); then
              echo "Processed Markdown files: $file_count"
          fi

          mapfile -t shortcodes < <(
              grep -oE '\{\{< *gist +"[^"]+" +"[^"]+" +"[^"]+" *>\}\}' "$file" |
              sort -u || true
          )

          for shortcode in "${shortcodes[@]}"; do
              IFS=$'\t' read -r owner gist_id file_name < <(
                  printf '%s\n' "$shortcode" |
                  perl -ne '
                      if (/\{\{<\s*gist\s+"([^"]+)"\s+"([^"]+)"\s+"([^"]+)"\s*>\}\}/) {
                          print "$1\t$2\t$3\n";
                      }
                  '
              )

              [ -n "$owner" ] && [ -n "$gist_id" ] && [ -n "$file_name" ] || continue

              cache_key="${owner}/${gist_id}/${file_name}"

              if [ -n "${source_cache[$cache_key]+x}" ]; then
                  source_code="${source_cache[$cache_key]}"
              else
                  source_code=""

                  # Get Gist metadata from cache or GitHub API.
                  if [ -n "${gist_cache[$gist_id]+x}" ]; then
                      gist_json="${gist_cache[$gist_id]}"
                  else
                      response_file=$(mktemp)

                      http_code=$(curl -LsS \
                          --connect-timeout 10 \
                          --max-time 30 \
                          --retry 2 \
                          --retry-all-errors \
                          -o "$response_file" \
                          -w '%{http_code}' \
                          -H 'Accept: application/vnd.github+json' \
                          -H 'User-Agent: Aspose-Words-Documentation-Build' \
                          -H 'X-GitHub-Api-Version: 2022-11-28' \
                          -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                          "https://api.github.com/gists/${gist_id}" \
                          2>/dev/null || true)

                      if [ "$http_code" = "200" ] &&
                          jq -e '.files | type == "object"' \
                              "$response_file" >/dev/null 2>&1; then
                          gist_json=$(cat "$response_file")
                          gist_cache["$gist_id"]="$gist_json"
                          gist_count=$((gist_count + 1))
                      else
                          gist_json=""
                          echo "Warning: Failed to retrieve Gist ${gist_id}; HTTP ${http_code:-unknown}."
                      fi

                      rm -f "$response_file"
                  fi

                  # Resolve the exact requested filename.
                  if [ -n "$gist_json" ]; then
                      raw_url=$(printf '%s' "$gist_json" |
                          jq -r --arg name "$file_name" \
                              '.files[$name].raw_url // empty')

                      # Download the source into a temporary file.
                      if [ -n "$raw_url" ]; then
                          source_file=$(mktemp)

                          if curl -fLsS \
                              --connect-timeout 10 \
                              --max-time 30 \
                              --retry 2 \
                              --retry-all-errors \
                              -o "$source_file" \
                              "$raw_url" 2>/dev/null &&
                              [ -s "$source_file" ]; then
                              source_code=$(cat "$source_file")
                          else
                              source_code=""
                              echo "Warning: Failed to retrieve ${owner}/${gist_id}/${file_name}."
                          fi

                          rm -f "$source_file"
                      else
                          echo "Warning: File '${file_name}' not found in Gist ${gist_id}."
                      fi
                  fi

                  # Cache successful and failed retrievals.
                  source_cache["$cache_key"]="$source_code"
              fi

              # Leave the original shortcode unchanged if retrieval failed.
              if [ -z "$source_code" ]; then
                  failed_count=$((failed_count + 1))
                  continue
              fi

              case "$file_name" in
                  *.cs)       language="csharp" ;;
                  *.java)     language="java" ;;
                  *.py)       language="python" ;;
                  *.cpp|*.h)  language="cpp" ;;
                  *.js)       language="javascript" ;;
                  *.ts)       language="typescript" ;;
                  *.php)      language="php" ;;
                  *.xml)      language="xml" ;;
                  *.json)     language="json" ;;
                  *.sql)      language="sql" ;;
                  *.vb)       language="vb" ;;
                  *.rb)       language="ruby" ;;
                  *.go)       language="go" ;;
                  *.sh)       language="bash" ;;
                  *)          language="" ;;
              esac

              code_block=$(printf '```%s\n%s\n```' "$language" "$source_code")

              SHORTCODE="$shortcode" CODE_BLOCK="$code_block" \
              perl -0777 -i -pe '
                  my $shortcode = $ENV{"SHORTCODE"};
                  my $replacement = $ENV{"CODE_BLOCK"};
                  s/\Q$shortcode\E/$replacement/g;
              ' "$file"

              replaced_count=$((replaced_count + 1))
          done

          # Preserve the existing Markdown transformations.
          perl -0777 -i -pe '
              s|<div class="card-group">||g;
              s|<div class="container">||g;
              s|</div>||g;

              s|<a href="([^"]+)">[^<]*<h3>([^<]+)</h3>[^<]*<p>([^<]+)</p>|\[$2\]($1) - $3|g;

              s|\{\{<\s*highlight\s+([a-zA-Z0-9]+)\s*>}}|```\1|g;
              s|\{\{<\s*/highlight\s*>}}|```|g;
              s|\{\{<\s*hr-first\s*>}}|---|g;

              s|\{\{% *quote *%}}|> |g;
              s|\{\{% */quote *%}}||g;

              s|\{\{% *alert[^%]*%}}|```|g;
              s|\{\{% */alert[^%]*%}}|```|g;

              s|<img[^>]*src="([^"]+)"[^>]*alt="([^"]+)"[^>]*/?>|![$2]($1)|g;
              s|<i[^>]*>[^<]*</i>|* |g;
              s|<span[^>]*>||g;
              s|</span>||g;
              s|<strong>|**|g;
              s|</strong>|**|g;
              s|<a href="([^"]*)">|$1 - |g;
              s|</a>||g;

              s#<p id="api-button-id">\s*<a href="([^"]+)".*>(⬇\s*)?([^<]+)</a>\s*</p>#($3)[$1]#g;

              s/\x{201C}/"/g;
              s/\x{201D}/"/g;
              s/\x{2013}/-/g;
              s/\x{2014}/-/g;
              s/\x{2192}/-/g;

              s|<ul[^>]*>||g;
              s|</ul>||g;
              s|<u[^>]*>||g;
              s|</u>||g;
              s|<li[^>]*>||g;
              s|</li>||g;
              s|<b[^>]*>||g;
              s|</b>||g;

              s|<br[[:space:]]*/?>|\n|g;
              s|</br>|\n|g;
              s|<sup class="alert-icon">||g;
              s|</sup>||g;

              s/\r//g;
          ' "$file"

      done < <(find "$DOCS_BUILD_OUTPUT" -type f -name '*.md' -print0)

      echo "Processed Markdown files: $file_count"
      echo "Unique Gists fetched: $gist_count"
      echo "Replaced Gist shortcodes: $replaced_count"
      echo "Failed Gist retrievals: $failed_count"
      echo "===== END GIST PROCESSING ====="
      date

      echo "===== GIST PROCESSING SUMMARY ====="
      echo "Successfully replaced: $replaced_count"
      echo "Failed retrievals: $failed_count"

      if [ "$failed_count" -gt 0 ]; then
          echo "WARNING: Some Gist shortcodes were preserved unchanged."
      else
          echo "All encountered Gist shortcodes were processed."
      fi
      BASH

    - |
      echo "===== HTML INTEGRITY CHECK: AFTER ====="

      find "$DOCS_BUILD_OUTPUT" -type f -name "*.html" \
          -exec sha256sum {} + | sort > /tmp/html-after.txt

      if ! diff -u /tmp/html-before.txt /tmp/html-after.txt; then
          echo "ERROR: HTML files were modified during Markdown post-processing"
          exit 1
      fi

      echo "HTML files integrity check passed."

    - echo "Compressing generated documentation..."
    - cd "$CI_HOME_FOLDER"
    - mkdir -p "$DOCS_BUILD_OUTPUT_ARCHIVE"
    - tar --warning=all -czf "$DOCS_FULL_ARCHIVE_NAME" "./$DOCS_BUILD_OUTPUT_FOLDER"
    - mv "./$DOCS_FULL_ARCHIVE_NAME" "$DOCS_BUILD_OUTPUT_ARCHIVE/$DOCS_FULL_ARCHIVE_NAME"
    - echo "Documentation compressed."

  artifacts:
    paths:
      - $DOCS_BUILD_OUTPUT/
      - $DOCS_BUILD_OUTPUT_ARCHIVE/$DOCS_FULL_ARCHIVE_NAME
    expire_in: 1 day

.ssh_setup:
  image: alpine:latest
  variables:
    GIT_STRATEGY: none # no git clone
  before_script:
    - echo "Adding tools..."
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - echo "$COPY_DOCS_SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - echo -e "Host *\n\tStrictHostKeyChecking no\n" > ~/.ssh/config
    - echo "Tools has added and tuned."

deploy:
  stage: deploy
  extends:
    - .rules:deploy
    - .ssh_setup
  needs:
    - job: build
  script:
    - echo "Transferring documentation archive to $COPY_SERVER_ADDRESS..."
    - scp $DOCS_BUILD_OUTPUT_ARCHIVE/$DOCS_FULL_ARCHIVE_NAME
      $COPY_USER_NAME@$COPY_SERVER_ADDRESS:$COPY_FOLDER

    - |
      echo "Executing remote deployment and synchronization..."
      ssh $COPY_USER_NAME@$COPY_SERVER_ADDRESS "
        # By default, a shell script will keep running even if a command fails. If tar fails, you don't want the script to proceed to rsync an empty folder. set -e forces the script to stop and fail the GitLab job the moment any command returns a non-zero exit code.
        set -e
        
        # 1. Cleanup and Unpack
        echo 'Unpacking archive...'
        rm -rf $COPY_FOLDER/$DOCS_BUILD_OUTPUT_FOLDER || true
        tar -xzf $COPY_FOLDER/$DOCS_FULL_ARCHIVE_NAME -C $COPY_FOLDER
        rm -f $COPY_FOLDER/$DOCS_FULL_ARCHIVE_NAME
        
        # 2. Validation
        if [ ! -d \"$COPY_FOLDER/$DOCS_BUILD_OUTPUT_FOLDER\" ] || [ -z \"\$(ls -A \"$COPY_FOLDER/$DOCS_BUILD_OUTPUT_FOLDER\")\" ]; then
          echo 'Error: Source directory is empty or missing.'
          exit 1
        fi
        
        # 3. Permissions and Sync
        echo 'Applying permissions and syncing to $SYNC_FOLDER...'
        sudo chown -R service_words:service_words \"$COPY_FOLDER/$DOCS_BUILD_OUTPUT_FOLDER\"
        sudo find \"$COPY_FOLDER/$DOCS_BUILD_OUTPUT_FOLDER\" -type f -exec chmod 644 {} +
        sudo find \"$COPY_FOLDER/$DOCS_BUILD_OUTPUT_FOLDER\" -type d -exec chmod 755 {} +
        
        # Protect source during sync and execute rsync
        sudo chattr +i \"$COPY_FOLDER/$DOCS_BUILD_OUTPUT_FOLDER\"
        sudo rsync -a --delete \"$COPY_FOLDER/$DOCS_BUILD_OUTPUT_FOLDER/\" \"$SYNC_FOLDER/\"
        sudo chattr -i \"$COPY_FOLDER/$DOCS_BUILD_OUTPUT_FOLDER\"
        
        echo 'Remote sync successful.'

        echo 'Creating flat Markdown endpoints...'

        sudo find \"$SYNC_FOLDER\" -type f -name "index.md" | while read -r file; do
          target="\${file%/index.md}.md"
          sudo cp -f "\$file" "\$target"
        done

        echo 'Flat Markdown endpoints created.'
      "
    - echo "Documentation deployment complete."